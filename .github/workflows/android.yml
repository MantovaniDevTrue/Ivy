name: Android ARM64
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet workload install android --skip-manifest-update
      - run: sdkmanager "ndk;27.3.13750724"
      - run: dotnet build src/Ivy.Android/Ivy.Android.csproj -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSdkLicenses=True
      - run: IVY_NDK_DIR="$ANDROID_HOME/ndk/27.3.13750724" bash scripts/build.sh
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash scripts/generate_bindings.sh tests/Ivy.BindingGenerator.Tests/bin/Release/net10.0 generated/fixture-api Terraria generated/MainPlayer.g.cs
      - run: cmp generated/MainPlayer.g.cs src/Ivy.Api/Generated/MainPlayer.g.cs
      - uses: actions/upload-artifact@v4
        with:
          name: Ivy-ARM64
          path: artifacts/*
          if-no-files-found: error
